<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f0f">

<title>Idown</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #0f0f0f;
    --bg2: #181818;
    --card: #202020;
    --card-hover: #292929;
    --text: #fff;
    --muted: #aaa;
    --border: #303030;
    --accent: #ff0033;
    --accent2: #ff1744;
    --input: #222;
}

body.light {
    --bg: #f5f5f5;
    --bg2: #fff;
    --card: #fff;
    --card-hover: #eee;
    --text: #111;
    --muted: #666;
    --border: #ddd;
    --input: #eee;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: .2s;
}

/* HEADER */

header {
    height: 64px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 18px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 22px;
    font-weight: bold;
    min-width: 125px;
    cursor: pointer;
}

.logo-icon {
    width: 35px;
    height: 25px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.logo-icon::after {
    content: "";
    border-left: 9px solid white;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    margin-left: 2px;
}

.logo span {
    color: var(--accent);
}

.search {
    flex: 1;
    max-width: 700px;
    display: flex;
    margin: auto;
}

.search input {
    flex: 1;
    height: 42px;
    background: var(--input);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 22px 0 0 22px;
    padding: 0 18px;
    outline: none;
    font-size: 15px;
}

.search input:focus {
    border-color: #666;
}

.search button {
    width: 55px;
    border: 1px solid var(--border);
    border-left: none;
    border-radius: 0 22px 22px 0;
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    font-size: 18px;
}

.search button:hover {
    background: var(--card-hover);
}

.header-actions {
    display: flex;
    gap: 8px;
}

.icon-btn {
    width: 40px;
    height: 40px;
    border: none;
    background: transparent;
    color: var(--text);
    border-radius: 50%;
    cursor: pointer;
    font-size: 19px;
}

.icon-btn:hover {
    background: var(--card-hover);
}

/* LAYOUT */

.layout {
    display: flex;
}

.sidebar {
    width: 230px;
    min-height: calc(100vh - 64px);
    background: var(--bg2);
    border-right: 1px solid var(--border);
    padding: 18px 10px;
    position: fixed;
    top: 64px;
    left: 0;
    bottom: 0;
}

.nav-item {
    height: 45px;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 15px;
    border-radius: 10px;
    cursor: pointer;
    color: var(--text);
    margin-bottom: 4px;
}

.nav-item:hover,
.nav-item.active {
    background: var(--card-hover);
}

.nav-item .emoji {
    width: 22px;
    text-align: center;
}

.main {
    margin-left: 230px;
    width: calc(100% - 230px);
    padding: 28px;
}

/* HOME */

.hero {
    max-width: 1000px;
    margin: 20px auto 45px;
    text-align: center;
}

.hero h1 {
    font-size: 42px;
    margin-bottom: 12px;
}

.hero h1 span {
    color: var(--accent);
}

.hero p {
    color: var(--muted);
    font-size: 16px;
    margin-bottom: 28px;
}

.big-search {
    max-width: 760px;
    margin: auto;
    display: flex;
}

.big-search input {
    flex: 1;
    height: 54px;
    border: 1px solid var(--border);
    background: var(--input);
    color: var(--text);
    border-radius: 12px 0 0 12px;
    padding: 0 18px;
    font-size: 16px;
    outline: none;
}

.big-search button {
    width: 130px;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: bold;
    border-radius: 0 12px 12px 0;
    cursor: pointer;
}

.big-search button:hover {
    background: var(--accent2);
}

/* QUICK BUTTONS */

.quick {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 18px;
}

.quick button {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 9px 14px;
    border-radius: 20px;
    cursor: pointer;
}

/* SECTION */

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.section-title h2 {
    font-size: 22px;
}

.clear-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 13px;
    border-radius: 8px;
    cursor: pointer;
}

.clear-btn:hover {
    color: var(--text);
}

/* CARDS */

.video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
}

.video-card {
    background: var(--card);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform .15s, background .15s;
}

.video-card:hover {
    transform: translateY(-3px);
    background: var(--card-hover);
    border-color: var(--border);
}

.thumb {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #111;
    position: relative;
}

.thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.card-info {
    padding: 12px;
}

.card-title {
    font-weight: bold;
    font-size: 14px;
    line-height: 1.4;
    margin-bottom: 7px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.card-id {
    font-size: 12px;
    color: var(--muted);
}

.favorite-card {
    position: relative;
}

.remove-favorite {
    position: absolute;
    right: 8px;
    top: 8px;
    background: rgba(0,0,0,.7);
    color: white;
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    z-index: 2;
}

/* PLAYER */

.player-page {
    max-width: 1200px;
    margin: auto;
}

.player-wrapper {
    background: #000;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
}

#player {
    width: 100%;
    height: 100%;
}

.player-info {
    padding: 18px 2px;
}

.player-title {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 14px;
}

/* PLAYER ACTIONS & DROPDOWNS */

.player-actions-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    position: relative;
}

.dropdown-wrapper {
    position: relative;
}

.action-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: background 0.15s, border-color 0.15s;
}

.action-btn:hover {
    background: var(--card-hover);
    border-color: #666;
}

.action-btn.primary-download {
    border-color: var(--accent);
    color: var(--accent);
}

.action-btn.primary-download:hover {
    background: rgba(255, 0, 51, 0.1);
}

.action-btn.favorite.active {
    color: #ff1744;
    border-color: #ff1744;
}

.icon-only-btn {
    padding: 10px 14px;
    font-size: 16px;
    letter-spacing: 2px;
}

.dropdown-menu {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    z-index: 50;
    min-width: 220px;
    padding: 6px;
}

.dropdown-menu.right-align {
    left: auto;
    right: 0;
}

.dropdown-menu.show {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.dropdown-menu button {
    background: transparent;
    border: none;
    color: var(--text);
    text-align: left;
    padding: 10px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
}

.dropdown-menu button:hover {
    background: var(--card-hover);
}

.player-details {
    border-top: 1px solid var(--border);
    margin-top: 20px;
    padding-top: 18px;
    color: var(--muted);
}

.player-details strong {
    color: var(--text);
}

/* CINEMA */

body.cinema .sidebar,
body.cinema header {
    display: none;
}

body.cinema .main {
    margin: 0;
    width: 100%;
    padding: 0;
}

body.cinema .player-page {
    max-width: 100%;
}

body.cinema .player-wrapper {
    height: 100vh;
    aspect-ratio: auto;
    border-radius: 0;
}

body.cinema .player-info {
    display: none;
}

/* EMPTY */

.empty {
    text-align: center;
    padding: 70px 20px;
    color: var(--muted);
}

.empty-icon {
    font-size: 50px;
    margin-bottom: 15px;
}

/* TOAST */

.toast {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #222;
    color: white;
    padding: 12px 18px;
    border-radius: 10px;
    opacity: 0;
    pointer-events: none;
    transition: .25s;
    z-index: 999;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* MOBILE */

.mobile-menu {
    display: none;
}

@media(max-width: 800px) {

    header {
        height: 58px;
        padding: 0 10px;
        gap: 8px;
    }

    .logo {
        min-width: auto;
    }

    .logo-text {
        display: none;
    }

    .search {
        max-width: none;
    }

    .search input {
        height: 38px;
    }

    .search button {
        width: 45px;
    }

    .header-actions {
        display: none;
    }

    .sidebar {
        display: none;
    }

    .main {
        margin-left: 0;
        width: 100%;
        padding: 18px 12px 80px;
    }

    .hero {
        margin: 30px auto 35px;
    }

    .hero h1 {
        font-size: 32px;
    }

    .big-search input {
        height: 50px;
    }

    .big-search button {
        width: 95px;
    }

    .video-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .card-info {
        padding: 9px;
    }

    .player-title {
        font-size: 18px;
    }

    .player-wrapper {
        border-radius: 8px;
    }

    .mobile-menu {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 62px;
        background: var(--bg2);
        border-top: 1px solid var(--border);
        z-index: 100;
        justify-content: space-around;
    }

    .mobile-menu button {
        background: transparent;
        border: none;
        color: var(--muted);
        font-size: 11px;
        cursor: pointer;
    }

    .mobile-menu button div {
        font-size: 21px;
        margin-bottom: 2px;
    }

    .mobile-menu button.active {
        color: var(--accent);
    }
}

@media(max-width: 400px) {
    .video-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<!-- HEADER -->

<header>

    <div class="logo" onclick="showPage('home')">

    </div>

    </div>

</aside>


<!-- MAIN -->

<main class="main">

<!-- HOME -->

<section id="homePage">

        <p>

        Tema
    </button>

<!-- YOUTUBE API -->

<script src="https://www.youtube.com/iframe_api"></script>

<script>

/* =========================================================
   OITUBE
========================================================= */

let player = null;
let isPlayerReady = false;
let pendingVideoId = null;
let currentVideoId = null;
let currentTitle = "Vídeo";

let history = [];
let favorites = [];

try {
    history = JSON.parse(localStorage.getItem("oitube_history") || "[]");
} catch(e) { history = []; }

try {
    favorites = JSON.parse(localStorage.getItem("oitube_favorites") || "[]");
} catch(e) { favorites = []; }

let theme = localStorage.getItem("oitube_theme") || "dark";
let playbackSpeed = 1;


/* =========================================================
   GERENCIAMENTO DE DROPDOWNS
========================================================= */

function toggleDropdown(dropdownId) {
    const dropdown = document.getElementById(dropdownId);
    const isOpen = dropdown.classList.contains("show");
    
    // Fecha todos os dropdowns abertos
    document.querySelectorAll(".dropdown-menu").forEach(menu => {
        menu.classList.remove("show");
    });

    if (!isOpen) {
        dropdown.classList.add("show");
    }
}

// Fechar dropdowns ao clicar fora
window.addEventListener("click", function(event) {
    if (!event.target.closest(".dropdown-wrapper")) {
        document.querySelectorAll(".dropdown-menu").forEach(menu => {
            menu.classList.remove("show");
        });
    }
});


/* =========================================================
   TEMA
========================================================= */

if (theme === "light") {
    document.body.classList.add("light");
}

function toggleTheme() {
    document.body.classList.toggle("light");
    theme = document.body.classList.contains("light") ? "light" : "dark";
    localStorage.setItem("oitube_theme", theme);
    toast(theme === "light" ? "Tema claro ativado" : "Tema escuro ativado");
}


/* =========================================================
   YOUTUBE PLAYER
========================================================= */

function onYouTubeIframeAPIReady() {
    player = new YT.Player("player", {
        width: "100%",
        height: "100%",
        videoId: "",
        playerVars: {
            playsinline: 1,
            rel: 0
        },
        events: {
            onReady: onPlayerReady,
            onStateChange: onPlayerStateChange
        }
    });
}

function onPlayerReady(event) {
    isPlayerReady = true;
    if (pendingVideoId) {
        player.loadVideoById(pendingVideoId);
        pendingVideoId = null;
    }
}

function onPlayerStateChange(event) {
    if (
        event.data === YT.PlayerState.PLAYING ||
        event.data === YT.PlayerState.PAUSED ||
        event.data === YT.PlayerState.ENDED
    ) {
        saveCurrentHistory();
    }
}


/* =========================================================
   EXTRAÇÃO ROBUSTA DE ID
========================================================= */

function extractYouTubeId(url) {
    if (!url) return null;
    url = url.trim();

    if (/^[a-zA-Z0-9_-]{11}$/.test(url)) {
        return url;
    }

    try {
        let parsedUrl;
        if (!url.startsWith("http://") && !url.startsWith("https://")) {
            parsedUrl = new URL("https://" + url);
        } else {
            parsedUrl = new URL(url);
        }

        const hostname = parsedUrl.hostname.replace("www.", "");

        if (hostname === "youtube.com" || hostname === "m.youtube.com") {
            const v = parsedUrl.searchParams.get("v");
            if (v && /^[a-zA-Z0-9_-]{11}$/.test(v)) return v;

            const pathSegments = parsedUrl.pathname.split("/").filter(Boolean);
            if (["shorts", "embed", "live"].includes(pathSegments[0]) && pathSegments[1]) {
                const id = pathSegments[1].substring(0, 11);
                if (/^[a-zA-Z0-9_-]{11}$/.test(id)) return id;
            }
        } else if (hostname === "youtu.be") {
            const id = parsedUrl.pathname.slice(1, 12);
            if (/^[a-zA-Z0-9_-]{11}$/.test(id)) return id;
        }
    } catch (e) {}

    const patterns = [
        /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|live|shorts)\/|.*[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/
    ];

    for (const pattern of patterns) {
        const match = url.match(pattern);
        if (match && match[1]) return match[1];
    }

    return null;
}

async function fetchVideoTitle(id) {
    try {
        const res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`);
        if (res.ok) {
            const data = await res.json();
            return data.title;
        }
    } catch(e) {}
    return "Vídeo do YouTube";
}


/* =========================================================
   PESQUISA DE VÍDEOS POR TERMO (COM MULTIPLAS INSTÂNCIAS)
========================================================= */

async function searchYouTube(query, containerId) {
    const container = document.getElementById(containerId);
    container.innerHTML = `
        <div class="empty">
            <div class="empty-icon">⌕</div>
            <h3>Pesquisando...</h3>
            <p>Buscando vídeos para "${escapeHTML(query)}"</p>
        </div>
    `;

    // Lista de instâncias alternativas do Piped para garantir redundância
    const instances = [
        "https://pipedapi.kavin.rocks",
        "https://pipedapi.drgns.space",
        "https://api.piped.privacy.com.de"
    ];

    let data = null;

    // Tenta cada instância em sequência até obter sucesso
    for (const instance of instances) {
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000); // Timeout de 5s por servidor

            const res = await fetch(`${instance}/search?q=${encodeURIComponent(query)}&filter=videos`, {
                signal: controller.signal
            });
            
            clearTimeout(timeoutId);

            if (res.ok) {
                data = await res.json();
                break; // Sucesso, sai do loop
            }
        } catch (e) {
            // Se falhar, continua para a próxima instância da lista
        }
    }

    if (!data || !data.items) {
        container.innerHTML = `
            <div class="empty">
                <div class="empty-icon">⚠</div>
                <h3>Instabilidade na busca</h3>
                <p>As instâncias públicas de pesquisa estão indisponíveis no momento. Tente novamente em instantes.</p>
            </div>
        `;
        return;
    }

    const items = (data.items || []).filter(item => item.type === 'stream');

    if (!items.length) {
        container.innerHTML = `
            <div class="empty">
                <div class="empty-icon">∅</div>
                <h3>Nenhum vídeo encontrado</h3>
                <p>Tente pesquisar com outros termos.</p>
            </div>
        `;
        return;
    }

    container.innerHTML = `
        <div class="section-title">
            <h2>Resultados para: "${escapeHTML(query)}"</h2>
        </div>
        <div class="video-grid">
            ${items.map(item => {
                const videoId = item.url ? (item.url.split("/watch?v=")[1] || item.videoId) : item.videoId;
                const safeTitle = escapeHTML(item.title);
                const thumb = item.thumbnail || `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;
                const uploader = escapeHTML(item.uploaderName || 'YouTube');
                return `
                    <article class="video-card card-item" data-id="${videoId}" data-title="${safeTitle}">
                        <div class="thumb">
                            <img src="${thumb}" alt="Miniatura" loading="lazy">
                        </div>
                        <div class="card-info">
                            <div class="card-title">${safeTitle}</div>
                            <div class="card-id">${uploader}</div>
                        </div>
                    </article>
                `;
            }).join("")}
        </div>
    `;
    bindCardClicks(containerId);
}


/* =========================================================
   ABRIR VÍDEO
========================================================= */

async function handleInputQuery(inputVal) {
    if (!inputVal) {
        toast("Digite um link ou termo de pesquisa.");
        return;
    }

    const id = extractYouTubeId(inputVal);
    if (id) {
        openVideo(id);
    } else {
        showPage("home");
        document.getElementById("homeInput").value = inputVal;
        await searchYouTube(inputVal, "homeContent");
    }
}

async function handleHomeSearch(event) {
    event.preventDefault();
    const val = document.getElementById("homeInput").value;
    await handleInputQuery(val);
}

async function handleHeaderSearch(event) {
    event.preventDefault();
    const val = document.getElementById("headerSearch").value;
    await handleInputQuery(val);
}

async function openVideo(id, providedTitle) {
    currentVideoId = id;
    currentTitle = providedTitle || await fetchVideoTitle(id);

    document.getElementById("currentTitle").textContent = currentTitle;
    document.getElementById("currentId").textContent = id;

    showPage("player");

    if (isPlayerReady && player && player.loadVideoById) {
        player.loadVideoById(id);
    } else {
        pendingVideoId = id;
    }

    updateFavoriteButton();
    addToHistory(id, currentTitle);
}


/* =========================================================
   DOWNLOAD MP4 / MP3
========================================================= */

function downloadMedia(type, qualityLabel) {
    if (!currentVideoId) return;
    const url = `https://www.youtube.com/watch?v=${currentVideoId}`;
    window.open(`https://cobalt.tools/?url=${encodeURIComponent(url)}`, '_blank');
    toast(`Baixando ${type.toUpperCase()} (${qualityLabel})...`);
    
    // Fecha os menus dropdown abertos
    document.querySelectorAll(".dropdown-menu").forEach(menu => menu.classList.remove("show"));
}


/* =========================================================
   PÁGINAS E NAVEGAÇÃO
========================================================= */

function showPage(page) {
    document.getElementById("homePage").style.display = page === "home" ? "block" : "none";
    document.getElementById("playerPage").style.display = page === "player" ? "block" : "none";
    document.getElementById("historyPage").style.display = page === "history" ? "block" : "none";
    document.getElementById("favoritesPage").style.display = page === "favorites" ? "block" : "none";

    document.querySelectorAll(".sidebar .nav-item").forEach(item => item.classList.remove("active"));
    const nav = document.getElementById("nav-" + page);
    if (nav) nav.classList.add("active");

    document.querySelectorAll(".mobile-menu button").forEach(btn => btn.classList.remove("active"));
    const mobileNav = document.getElementById("mobile-nav-" + page);
    if (mobileNav) mobileNav.classList.add("active");

    if (page === "history") renderHistory();
    if (page === "favorites") renderFavorites();
    if (page === "home") renderHome();
}


/* =========================================================
   HISTÓRICO
========================================================= */

function addToHistory(id, title) {
    const existing = history.find(item => item.id === id);
    if (existing) {
        existing.title = title || existing.title;
        existing.date = new Date().toISOString();
    } else {
        history.unshift({
            id: id,
            title: title || "Vídeo do YouTube",
            date: new Date().toISOString()
        });
    }
    history = history.slice(0, 50);
    saveHistory();
}

function saveCurrentHistory() {
    if (!currentVideoId) return;
    addToHistory(currentVideoId, currentTitle);
}

function saveHistory() {
    localStorage.setItem("oitube_history", JSON.stringify(history));
}

function renderHistory() {
    const container = document.getElementById("historyList");
    if (!history.length) {
        container.innerHTML = `
            <div class="empty">
                <div class="empty-icon">◷</div>
                <h3>Seu histórico está vazio</h3>
                <p>Os vídeos assistidos aparecerão aqui.</p>
            </div>
        `;
        return;
    }
    container.innerHTML = `
        <div class="video-grid" id="historyGrid">
            ${history.map(item => videoCardMarkup(item)).join("")}
        </div>
    `;
    bindCardClicks("historyList");
}

function clearHistory() {
    if (!history.length) {
        toast("O histórico já está vazio.");
        return;
    }
    if (!confirm("Deseja apagar todo o histórico?")) return;
    history = [];
    saveHistory();
    renderHistory();
    toast("Histórico apagado.");
}


/* =========================================================
   FAVORITOS
========================================================= */

function toggleCurrentFavorite() {
    if (!currentVideoId) return;
    const index = favorites.findIndex(item => item.id === currentVideoId);

    if (index >= 0) {
        favorites.splice(index, 1);
        toast("Removido dos favoritos.");
    } else {
        favorites.unshift({
            id: currentVideoId,
            title: currentTitle,
            date: new Date().toISOString()
        });
        toast("Adicionado aos favoritos.");
    }

    saveFavorites();
    updateFavoriteButton();
}

function saveFavorites() {
    localStorage.setItem("oitube_favorites", JSON.stringify(favorites));
}

function updateFavoriteButton() {
    const button = document.getElementById("favoriteButton");
    if (!button) return;
    const isFavorite = favorites.some(item => item.id === currentVideoId);
    if (isFavorite) {
        button.classList.add("active");
        button.innerHTML = "<span>♥</span> Favoritado";
    } else {
        button.classList.remove("active");
        button.innerHTML = "<span>♡</span> Favoritar";
    }
}

function removeFavorite(id) {
    favorites = favorites.filter(item => item.id !== id);
    saveFavorites();
    renderFavorites();
    updateFavoriteButton();
    toast("Removido dos favoritos.");
}

function renderFavorites() {
    const container = document.getElementById("favoritesList");
    if (!favorites.length) {
        container.innerHTML = `
            <div class="empty">
                <div class="empty-icon">♥</div>
                <h3>Nenhum favorito</h3>
                <p>Seus vídeos favoritos aparecerão aqui.</p>
            </div>
        `;
        return;
    }
    container.innerHTML = `
        <div class="video-grid" id="favoritesGrid">
            ${favorites.map(item => favoriteCardMarkup(item)).join("")}
        </div>
    `;
    bindCardClicks("favoritesList");
    
    container.querySelectorAll(".remove-favorite").forEach(btn => {
        btn.addEventListener("click", (e) => {
            e.stopPropagation();
            removeFavorite(btn.dataset.id);
        });
    });
}


/* =========================================================
   CARDS E BINDING SEGURO DE EVENTOS
========================================================= */

function videoCardMarkup(item) {
    const safeTitle = escapeHTML(item.title);
    return `
        <article class="video-card card-item" data-id="${item.id}" data-title="${safeTitle}">
            <div class="thumb">
                <img src="https://i.ytimg.com/vi/${item.id}/hqdefault.jpg" alt="Miniatura" loading="lazy">
            </div>
            <div class="card-info">
                <div class="card-title">${safeTitle}</div>
                <div class="card-id">YouTube • ${formatDate(item.date)}</div>
            </div>
        </article>
    `;
}

function favoriteCardMarkup(item) {
    const safeTitle = escapeHTML(item.title);
    return `
        <article class="video-card favorite-card card-item" data-id="${item.id}" data-title="${safeTitle}">
            <button class="remove-favorite" data-id="${item.id}">×</button>
            <div class="thumb">
                <img src="https://i.ytimg.com/vi/${item.id}/hqdefault.jpg" alt="Miniatura" loading="lazy">
            </div>
            <div class="card-info">
                <div class="card-title">${safeTitle}</div>
                <div class="card-id">Favoritado</div>
            </div>
        </article>
    `;
}

function bindCardClicks(containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.querySelectorAll(".card-item").forEach(card => {
        card.addEventListener("click", () => {
            const id = card.dataset.id;
            const title = card.dataset.title;
            openVideo(id, title);
        });
    });
}


/* =========================================================
   HOME CONTENT
========================================================= */

function renderHome() {
    const container = document.getElementById("homeContent");
    if (!history.length) {
        container.innerHTML = `
            <div class="empty">
                <div class="empty-icon">▶</div>
                <h3>Comece assistindo ou pesquisando</h3>
                <p>Cole um link do YouTube ou pesquise por termo acima.</p>
            </div>
        `;
        return;
    }

    const recent = history.slice(0, 8);
    container.innerHTML = `
        <div class="section-title">
            <h2>Continue assistindo</h2>
            <button class="clear-btn" onclick="showPage('history')">Ver tudo</button>
        </div>
        <div class="video-grid" id="homeGrid">
            ${recent.map(item => videoCardMarkup(item)).join("")}
        </div>
    `;
    bindCardClicks("homeContent");
}


/* =========================================================
   CONTROLES DO PLAYER
========================================================= */

function toggleCinema() {
    document.body.classList.toggle("cinema");
    document.querySelectorAll(".dropdown-menu").forEach(menu => menu.classList.remove("show"));
}

function toggleFullscreen() {
    const wrapper = document.querySelector(".player-wrapper");
    if (!document.fullscreenElement) {
        if (wrapper.requestFullscreen) wrapper.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
    document.querySelectorAll(".dropdown-menu").forEach(menu => menu.classList.remove("show"));
}

function openYoutube() {
    if (!currentVideoId) return;
    window.open("https://www.youtube.com/watch?v=" + currentVideoId, "_blank");
    document.querySelectorAll(".dropdown-menu").forEach(menu => menu.classList.remove("show"));
}

async function shareCurrent() {
    if (!currentVideoId) return;
    const url = "https://www.youtube.com/watch?v=" + currentVideoId;
    if (navigator.share) {
        try {
            await navigator.share({ title: "OiTube", text: currentTitle, url: url });
        } catch(e) {}
    } else {
        await navigator.clipboard.writeText(url);
        toast("Link copiado.");
    }
    document.querySelectorAll(".dropdown-menu").forEach(menu => menu.classList.remove("show"));
}

function changeSpeed() {
    if (!player || !player.setPlaybackRate) return;
    const speeds = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
    let index = speeds.indexOf(playbackSpeed);
    index++;
    if (index >= speeds.length) index = 0;
    playbackSpeed = speeds[index];
    player.setPlaybackRate(playbackSpeed);
    
    const speedLabel = document.getElementById("speedLabel");
    if (speedLabel) speedLabel.textContent = playbackSpeed + "x";
    
    toast("Velocidade: " + playbackSpeed + "x");
}

async function pasteClipboard() {
    try {
        const text = await navigator.clipboard.readText();
        if (!text) {
            toast("Área de transferência vazia.");
            return;
        }
        document.getElementById("homeInput").value = text;
        await handleInputQuery(text);
    } catch(e) {
        toast("Não foi possível acessar a área de transferência.");
    }
}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;
function toast(message) {
    const element = document.getElementById("toast");
    element.textContent = message;
    element.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
        element.classList.remove("show");
    }, 2500);
}


/* =========================================================
   UTILITÁRIOS
========================================================= */

function formatDate(date) {
    if (!date) return "";
    const d = new Date(date);
    return d.toLocaleDateString("pt-BR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
    });
}

function escapeHTML(text) {
    return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   TECLADO
========================================================= */

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        document.body.classList.remove("cinema");
    }
    if (event.key.toLowerCase() === "f" && document.activeElement.tagName !== "INPUT") {
        toggleFullscreen();
    }
});


/* =========================================================
   INIT
========================================================= */

renderHome();

</script>
